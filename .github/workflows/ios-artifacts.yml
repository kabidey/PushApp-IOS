name: iOS artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-pod-example-ios:
    name: Build pod example app (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install CocoaPods deps
        working-directory: Example
        run: pod install

      - name: Build example for iOS Simulator
        working-directory: Example
        run: |
          set -o pipefail
          xcodebuild \
            -workspace PushApp-IOS.xcworkspace \
            -scheme PushApp-IOS-Example \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            build \
            | tail -40

      - name: Run pod lib lint (build the pod itself)
        run: |
          set -o pipefail
          pod lib lint \
            --skip-import-validation \
            --skip-tests \
            --allow-warnings \
            | tail -20

      - name: Locate built .app
        id: locate
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name 'PushApp-IOS_Example.app' | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No PushApp-IOS_Example.app found in DerivedData" && exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found: $APP_PATH"

      - name: Zip .app
        env:
          APP_PATH: ${{ steps.locate.outputs.app_path }}
        run: |
          cd "$(dirname "$APP_PATH")"
          ditto -c -k --sequesterRsrc --keepParent "$(basename "$APP_PATH")" "$RUNNER_TEMP/PushAppIOSExample.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pushapp-ios-pod-example-app
          path: ${{ runner.temp }}/PushAppIOSExample.zip
          retention-days: 30
